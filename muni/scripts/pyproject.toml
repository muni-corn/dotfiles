[project]
name = "muni-scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.8.7",
    "pdfplumber>=0.11.9",
]

[project.scripts]
timesheet = "muni_scripts.timesheet:main"
new-timesheet = "muni_scripts.new_timesheet:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
